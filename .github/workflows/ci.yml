name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Every check of the Dagger module in .dagger: lint, unit tests, integration tests against a fresh
  # Lightdash, and the image build. `make check` runs the same ones locally.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: v0.21.11 # the engineVersion in dagger.json
          verb: check
