# Weekly update PRs for the Python packages (uv.lock), the GitHub Actions and the base images,
# which are pinned by SHA and digest. Minor and patch updates are grouped into one PR per kind, and
# a release must be a week old first, so a compromised release has time to be caught upstream.
# Security updates come on their own, as soon as an alert opens.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        update-types: [minor, patch]
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      images:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(deps)"
